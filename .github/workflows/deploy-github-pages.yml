name: Deploy static app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1) Descargar código
        uses: actions/checkout@v4

      - name: 2) Validar secretos obligatorios
        run: |
          test -n "${{ secrets.SUPABASE_URL }}" || (echo "Falta secret SUPABASE_URL" && exit 1)
          test -n "${{ secrets.SUPABASE_ANON_KEY }}" || (echo "Falta secret SUPABASE_ANON_KEY" && exit 1)

      - name: 3) Crear config.js desde secrets
        run: |
          cat > config.js << 'EOF_CONFIG'
          window.SUPABASE_CONFIG = {
            url: '${{ secrets.SUPABASE_URL }}',
            anonKey: '${{ secrets.SUPABASE_ANON_KEY }}'
          };
          EOF_CONFIG

      - name: 4) Preparar artefacto estático
        run: |
          mkdir -p dist
          cp -R . dist
          rm -rf dist/.git dist/.github

      - name: 5) Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 6) Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
